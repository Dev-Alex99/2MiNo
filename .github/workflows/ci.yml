name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # El lockfile está al día y verificado: una instalación reproducible es lo
      # que hace que el CI valide lo mismo que se despliega.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Tests (servidor)
        run: pnpm test

      # El lint BLOQUEA. Estuvo en `continue-on-error: true` y por ahí se coló a
      # main un `no-undef` (findMe sin importar en gameHandler) con el que
      # cualquier cliente anónimo tumbaba el servidor entero: el CI lo detectó y
      # descartó el resultado. Un lint cuyo fallo se ignora no es una barrera.
      # Los avisos (código muerto pendiente de limpiar) no bloquean; los errores sí.
      - name: Lint (cliente)
        run: pnpm --filter domino-client lint

      - name: Lint (servidor)
        run: pnpm --filter domino-server lint

      - name: Build (cliente)
        run: pnpm --filter domino-client build
