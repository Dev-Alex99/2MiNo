name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # No se usa --frozen-lockfile: el lockfile puede no reflejar aún los
      # últimos cambios de package.json (eslint devDep, engines). Cambiar a
      # --frozen-lockfile una vez regenerado y commiteado el pnpm-lock.yaml.
      - name: Install
        run: pnpm install

      - name: Tests (servidor)
        run: pnpm test

      - name: Lint (cliente) — advisory
        run: pnpm --filter domino-client lint
        continue-on-error: true

      - name: Lint (servidor) — advisory
        run: pnpm --filter domino-server lint
        continue-on-error: true

      - name: Build (cliente)
        run: pnpm --filter domino-client build
